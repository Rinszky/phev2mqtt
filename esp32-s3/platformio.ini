; PlatformIO Project Configuration for ESP32-S3 Outlander PHEV Remote Bridge
; Hardware: ESP32-S3 (8MB/16MB Flash, 2MB/8MB PSRAM) + LTE Modem (SIM7600/SIM7000/A7670/BG96)

[platformio]
default_envs = esp32-s3-phev2mqtt
src_dir = src
include_dir = include

[env:esp32-s3-phev2mqtt]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Configuration for 16MB Flash and Octal/Quad PSRAM (standard on ESP32-S3-WROOM-1/N16R8)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv

; Compiler flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2

; Libraries:
; - PubSubClient (MQTT)
; - ArduinoJson (v7 JSON serialization for HA discovery & MQTT)
; - WireGuard-ESP32 (lwIP native WireGuard tunnel)
; - TinyGSM (LTE modem AT / data call / PPP)
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    ciniml/WireGuard-ESP32@^0.1.5
    vshymanskyy/TinyGSM@^0.11.7

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 921600
