; PlatformIO Project Configuration for LilyGO T-A7670E/G/SA R2
; Hardware: ESP32-WROVER-E (Dual Core 240MHz, 4MB/8MB Flash, 8MB PSRAM) + SIMCom A7670E LTE Cat-1 with GPS

[platformio]
default_envs = lilygo-t-a7670e
src_dir = src
include_dir = include

[env:lilygo-t-a7670e]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino

; Board configuration for ESP32-WROVER-E with PSRAM
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv

; Compiler flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    -O2

; Libraries
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    ciniml/WireGuard-ESP32@^0.1.5
    vshymanskyy/TinyGSM@^0.11.7

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 921600
